syntax = "proto3";
package rep.framework.event.v1;

option go_package = "v1";

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "proto/types/commonpb/v3/common.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info : {
    title : "Relay Audit Service"
    version : "2.0"
    contact : {name : "Paralus Dev"}
  }
  schemes : HTTPS
  consumes : "application/json"
  consumes : "application/yaml"
  produces : "application/json"
  produces : "application/yaml"
  security_definitions : {
    security : {
      key : "BasicAuth"
      value : {type : TYPE_BASIC}
    }
    security : {
      key : "ApiKeyAuth"
      value : {type : TYPE_API_KEY in : IN_HEADER name : "X-API-KEYID"}
    }
    security : {
      key : "ApiTokenAuth"
      value : {
        type : TYPE_API_KEY in : IN_HEADER name : "X-API-TOKEN"
      }
    }
  }
  security : {
    security_requirement : {
      key : "BasicAuth"
      value : {}
    }
    security_requirement : {
      key : "ApiKeyAuth"
      value : {}
    }
    security_requirement : {
      key : "ApiTokenAuth"
      value : {}
    }
  }
  responses : {
    key : "403"
    value : {
      description : "Returned when the user does not have permission to access "
                    "the resource."
    }
  }
  responses : {
    key : "404"
    value : {
      description : "Returned when the resource does not exist."
      schema : {json_schema : {type : STRING}}
    }
  }
};

message RelayAuditQueryFilter {
  string type = 1;
  string user = 2;
  string client = 3;
  string timefrom = 4;
  string portal = 5;
  string cluster = 6;
  string namespace = 7;
  string kind = 8;
  string method = 9;
  repeated string projects = 10;
  string queryString = 11;
  bool dashboardData = 12;
  repeated string clusterNames = 13;
}

message RelayAuditRequest {
  // TODO: this was paralus.dev.common.types.v2.ParalusMeta
  paralus.dev.types.common.v3.Metadata metadata = 1;
  RelayAuditQueryFilter filter = 2;
  string auditType = 3;
}

message RelayAuditResponse {
  google.protobuf.Struct result = 1;
  string auditType = 2;
}

// Session recording messages
message SessionRecordingRequest {
  string sessionID = 1;
  string username = 2;
  string cluster = 3;
  string namespace = 4;
  string pod = 5;
  string container = 6;
  string project = 7;
  string command = 8;
  int64 startTime = 9;
}

message SessionRecordingChunk {
  string sessionID = 1;
  bytes data = 2;
  int64 timestamp = 3;
  string stream = 4; // stdout, stderr, stdin
}

message SessionRecordingEnd {
  string sessionID = 1;
  int64 endTime = 2;
  int32 exitCode = 3;
}

message SessionRecordingResponse {
  bool success = 1;
  string message = 2;
}

message GetSessionRecordingRequest {
  string sessionID = 1;
  paralus.dev.types.common.v3.Metadata metadata = 2;
}

message GetSessionRecordingResponse {
  SessionRecordingRequest sessionInfo = 1;
  repeated SessionRecordingChunk chunks = 2;
  SessionRecordingEnd endInfo = 3;
}

service RelayAuditService {
  rpc GetRelayAudit(RelayAuditRequest)
      returns (RelayAuditResponse) {
    option (google.api.http) = {
      get : "/event/v1/{metadata.urlScope=project/*}/audit/relay"
    };
  };

  rpc GetRelayAuditByProjects(RelayAuditRequest)
      returns (RelayAuditResponse) {
    option (google.api.http) = {
      get : "/event/v1/audit/relay"
    };
  };

  // Session recording endpoints
  rpc StartSessionRecording(SessionRecordingRequest)
      returns (SessionRecordingResponse) {
    option (google.api.http) = {
      post : "/event/v1/audit/session/start"
      body : "*"
    };
  };

  rpc RecordSessionChunk(SessionRecordingChunk)
      returns (SessionRecordingResponse) {
    option (google.api.http) = {
      post : "/event/v1/audit/session/chunk"
      body : "*"
    };
  };

  rpc EndSessionRecording(SessionRecordingEnd)
      returns (SessionRecordingResponse) {
    option (google.api.http) = {
      post : "/event/v1/audit/session/end"
      body : "*"
    };
  };

  rpc GetSessionRecording(GetSessionRecordingRequest)
      returns (GetSessionRecordingResponse) {
    option (google.api.http) = {
      get : "/event/v1/{metadata.urlScope=project/*}/audit/session/{sessionID}"
    };
  };
}